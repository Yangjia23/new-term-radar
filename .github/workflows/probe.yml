name: Probe TikTok charts

# One manual look at TikTok's other charts (scripts/probe_tiktok.py); the raw answers and
# a judged list come back as the "probe" artifact. Touches no state.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Probe
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/probe_tiktok.py
          cat probe/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ github.run_id }}
          path: probe/
          retention-days: 30
