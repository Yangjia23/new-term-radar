name: Probe TikTok charts

# One manual look, run by hand: TikTok's other charts (scripts/probe_tiktok.py) or the watch
# list's Trends check on names whose answer is known (scripts/probe_fresh.py). The output
# comes back as the "probe" artifact. Touches no state.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "probe_tiktok (other TikTok charts), probe_fresh (the watch list Trends check on known names), probe_series (raw Trends series), probe_templates (template videos of the last day) or probe_timeline (when a trend started: a year of Trends, the earliest TikTok videos)"
        default: "probe_tiktok"
      args:
        description: "phrases for the probe, comma-separated (probe_timeline)"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Probe
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PROBE_ARGS: ${{ github.event.inputs.args }}
        run: |
          python scripts/${{ github.event.inputs.script || 'probe_tiktok' }}.py
          cat probe/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ github.run_id }}
          path: probe/
          retention-days: 30
