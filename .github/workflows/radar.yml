name: New-term radar

# Two schedules, one state:
#   sources  every 8 hours: X and Hugging Face, where a name is said first. Posts a
#            report only when there is a new name.
#   searchwords  every hour: TikTok's trending searches into the watch list (radar/watch.py);
#            pushes a watched name once Google completes it with "ai".
#   daily    once a day: everything else, the review of leads from 14 days ago, and the
#            source leads of the last day. It runs at 09:15 UTC, after WhoisDS publishes the
#            day's newly registered domains (around 08:30 UTC).
#
# Off until you opt in: set the repository variable RADAR_ENABLED to "true"
# (Settings > Secrets and variables > Actions > Variables), add the secret AISA_API_KEY,
# and commit your config.json (remove it from .gitignore first; it holds no secrets).
# Optional secrets: GOANYAPI_API_KEY (related queries in the keyword table),
# RESEND_API_KEY, EMAIL_FROM, RADAR_EMAIL_TO (mail the reports),
# FEISHU_APP_ID, FEISHU_APP_SECRET, FEISHU_RECEIVE_ID (push the new names to a Feishu chat),
# SERPAPI_API_KEY (① rising), DEEPSEEK_API_KEY (the judge, with a deepseek-... model),
# GSC_TOKEN_JSON (the Search Console signal).
#
# State (state/radar.db and the snapshots) lives in the Actions cache: one entry per
# run, restored by prefix, so the repository does not grow. A missing cache only means
# the next run builds new snapshots and reports nothing that day; the leads database
# would start over, so download the "radar-state" artifact now and then if you care
# about the review's history.

# The schedule lives in a Cloudflare Worker (trigger/), which starts each run through
# workflow_dispatch: GitHub's own schedule dropped or delayed them by hours (on 20 October
# 2026, 3 of 14 hourly runs started, the daily report 7 hours late). UTC:
#   0 0,8,16 * * *  sources    15 9 * * *  daily    30 * * * *  searchwords
on:
  workflow_dispatch:
    inputs:
      command:
        description: "daily, sources, searchwords, or tiktok-chart (the whole TikTok chart, every hashtag judged)"
        default: "daily"

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMAND: ${{ github.event.inputs.command || 'daily' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore the state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Run the radar
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOANYAPI_API_KEY: ${{ secrets.GOANYAPI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
        run: |
          if [ "$COMMAND" = "daily" ]; then
            python -m radar daily --skip x,hf,tiktok,rising --out report.md ${RADAR_EMAIL_TO:+--mail} ${FEISHU_APP_ID:+--feishu}
          elif [ "$COMMAND" = "searchwords" ]; then
            python -m radar searchwords --out report.md ${FEISHU_APP_ID:+--feishu}
          elif [ "$COMMAND" = "tiktok-chart" ]; then
            python -m radar tiktok-chart --out report.md
          else
            python -m radar sources --out report.md ${RADAR_EMAIL_TO:+--mail} ${FEISHU_APP_ID:+--feishu}
          fi
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save the state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}

      - name: Keep the report and the state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ env.COMMAND }}-${{ github.run_id }}
          path: |
            report.md
            report.json
            state/radar.db
          if-no-files-found: ignore
          retention-days: 30
