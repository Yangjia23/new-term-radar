# Starts the radar's GitHub Actions runs on time. GitHub's own schedule drops or delays them
# by hours (on 20 October 2026, 3 of 14 hourly runs started); a workflow_dispatch starts
# within a minute. The jobs themselves still run on GitHub.
#
#   npx wrangler deploy
#   npx wrangler secret put GITHUB_TOKEN   # fine-grained, this repository only, Actions: read and write
#   npx wrangler secret put FEISHU_APP_ID      # optional, with the two below: a failed start is said in Feishu
#   npx wrangler secret put FEISHU_APP_SECRET
#   npx wrangler secret put FEISHU_RECEIVE_ID
name = "new-term-radar-trigger"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[vars]
REPO = "Yangjia23/new-term-radar"
WORKFLOW = "radar.yml"
REF = "main"

# Stopped on 28 October 2026. To restart, put back
#   crons = ["0 0,13 * * *", "0 4 * * *", "0 9 * * *"]
# (UTC: 08:00, 12:00, 17:00 and 21:00 Beijing time) and enable radar.yml on GitHub.
[triggers]
crons = []

[observability]
enabled = true
